name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x]
    
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build extension
      run: npm run compile

    - name: Run tests (Linux)
      run: xvfb-run -a npm test
      if: runner.os == 'Linux'

    - name: Run tests (Windows/macOS)
      run: npm test
      if: runner.os != 'Linux'

  integration-test:
    runs-on: ubuntu-latest
    
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: YourStrong@Passw0rd
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build extension
      run: npm run compile

    - name: Wait for SQL Server
      run: sleep 15

    - name: Create test database
      run: |
        docker exec $(docker ps -q -f ancestor=mcr.microsoft.com/mssql/server:2022-latest) \
          /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "YourStrong@Passw0rd" \
          -Q "CREATE DATABASE TestDB; USE TestDB; CREATE TABLE TestTable (Id INT PRIMARY KEY, Name NVARCHAR(100));"

    - name: Run integration tests
      run: xvfb-run -a npm test
      env:
        SQL_CONNECTION_STRING: "Server=localhost;Database=TestDB;User Id=sa;Password=YourStrong@Passw0rd;Encrypt=true;TrustServerCertificate=true"

  package:
    runs-on: ubuntu-latest
    needs: [build-and-test, integration-test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Package extension
      run: |
        npm install -g @vscode/vsce
        vsce package

    - name: Upload VSIX
      uses: actions/upload-artifact@v4
      with:
        name: sql-notebook-kernel-vsix
        path: '*.vsix'
